# CI (issue #18): typecheck → unit/contract tests → offline eval → build,
# plus the pgTAP database contracts (issue #496) and the Docker image build.
# Runs with NO secrets: no API keys, no hosted database. `verify` is offline by
# construction; `database` builds a throwaway local Postgres from the branch's
# own migrations (see the per-step comments).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # vitest does NOT typecheck — tsc is a separate, mandatory gate.
      - run: pnpm typecheck

      # This job intentionally has no Supabase stack. DB/RLS coverage is
      # enforced by the database job after it provisions its local API.
      - name: Run the offline Vitest suite
        env:
          SNAPLIST_OFFLINE_VERIFY: "1"
        run: pnpm test

      # Eval harness, OFFLINE path: checked-in sample predictions scored
      # against the gold set with the deterministic heuristic judge. The
      # --db / --real-judge flags are for local runs only — never CI.
      - run: pnpm eval

      # The production build must succeed without secrets (env validation is
      # lazy) — the same property the Docker image build relies on.
      - run: pnpm build

  # Database contracts (issue #496): the pgTAP suite is the behavioural proof
  # for database-level invariants — RLS tenancy, lifecycle triggers, queue
  # authority (ADR-0007). It needs a Postgres carrying this branch's
  # migrations, so it runs as its own job instead of inside `verify`, which is
  # offline by construction. Building from migrations every run also means CI
  # never inherits the drift a long-lived local database accumulates.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm prepare:supabase-loopback -- --source-only

      # The Supabase CLI is a devDependency, so CI runs the same version
      # developers do — no second place to bump it. Postgres plus the Auth API
      # start here: pgTAP talks to Postgres, and the shared RLS reachability
      # guard probes `/auth/v1/health`. `start` applies every migration in
      # supabase/migrations, then seeds.
      #
      # An exclude name the CLI no longer recognises is only a warning — it
      # starts that container anyway and exits 0. A CLI upgrade could then
      # quietly boot the whole stack and make the paragraph above false, so
      # treat the warning as fatal.
      - name: Start the database
        id: start
        run: |
          set -o pipefail
          pnpm supabase start -x edge-runtime,imgproxy,logflare,mailpit,postgres-meta,postgrest,realtime,storage-api,studio,supavisor,vector 2>&1 | tee start.log
          if grep -q 'not valid to exclude' start.log; then
            echo "::error::supabase start rejected an exclude name; the container set has drifted"
            exit 1
          fi

      - name: Export local Supabase credentials
        run: |
          set -a
          source <(node tools/supabase-loopback/supabase.mjs status -o env)
          set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # A skipped RLS suite is useful on a laptop but not merge evidence.
      # This is the only CI job with the local Auth API and its credentials.
      # Run every RLS suite plus each other shared-stack consumer here, where an
      # unreachable stack fails inside the suites instead of dropping coverage.
      - name: Require the provisioned Supabase stack for RLS coverage
        env:
          SNAPLIST_REQUIRE_DB_STACK: "1"
        run: pnpm exec tsx scripts/run-db-rls-vitest.ts

      # Same command as the local whole-suite run in
      # docs/runbooks/durable-pipeline-operations.md. pg_prove exits non-zero
      # on any failing contract, which fails the build.
      #
      # pg_prove also reports PASS for whatever it globs, so a contract that
      # stops matching would vanish silently — the same gap this job exists to
      # close. Compare what ran against every .sql file in the directory, the
      # superset the CLI selects from. Counting *.test.sql instead would let a
      # contract renamed off that pattern lower both sides and slip through.
      # This catches a file that stops being collected; a contract deleted
      # outright still lowers both sides and is left to code review, where it
      # is visible in the diff.
      - name: Run the pgTAP contracts
        run: |
          set -o pipefail
          pnpm supabase test db --local 2>&1 | tee pgtap.log
          expected=$(ls supabase/tests/*.sql | wc -l | tr -d ' ')
          reported=$(grep -oE 'Files=[0-9]+' pgtap.log | tail -1 | cut -d= -f2)
          if [ "$reported" != "$expected" ]; then
            echo "::error::pgTAP ran $reported contract files, expected $expected"
            exit 1
          fi
          echo "pgTAP ran all $expected contract files"

      # Ephemeral runners discard the containers anyway, but stop cleanly so a
      # self-hosted runner behaves the same. Skipped when the database never
      # started, so an earlier failure cannot add a confusing second red step.
      - if: always() && (steps.start.outcome == 'success' || steps.start.outcome == 'failure')
        run: pnpm supabase stop --no-backup

  # Proves the Dockerfile end-to-end (deps → standalone build → runner stage)
  # on every PR — also with zero secrets, since the image build injects none.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t snaplist:ci .
