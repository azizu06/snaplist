name: Core-product Graphify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  pull-request-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned AST-only Graphify tooling
        run: |
          uv tool install graphifyy==0.8.33
          uv pip install --python "$HOME/.local/share/uv/tools/graphifyy/bin/python" tree-sitter-sql==0.3.11
      - name: Test the incremental maintenance seam
        run: |
          "$HOME/.local/share/uv/tools/graphifyy/bin/python" scripts/graphify-core-product.test.py
      - name: Check committed core scope and incremental command
        run: scripts/graphify-core-product.sh --incremental --check

  refresh-main-artifact:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: core-change
        name: Detect core architecture change
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          changed="$(git diff --name-only "$BEFORE_SHA" "$SOURCE_SHA")"
          if printf '%s\n' "$changed" | grep -qxF 'docs/architecture/graphify-core-scope.txt' \
            || comm -12 <(printf '%s\n' "$changed" | sort) <(sort docs/architecture/graphify-core-scope.txt) | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.core-change.outputs.relevant == 'true'
      - name: Install pinned AST-only Graphify tooling
        if: steps.core-change.outputs.relevant == 'true'
        run: |
          uv tool install graphifyy==0.8.33
          uv pip install --python "$HOME/.local/share/uv/tools/graphifyy/bin/python" tree-sitter-sql==0.3.11
      - id: prior-run
        if: steps.core-change.outputs.relevant == 'true'
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'graphify-core-product.yml',
              branch: 'main',
              status: 'success',
              per_page: 10,
            });
            return String(data.workflow_runs.find((run) => run.id !== context.runId)?.id ?? '');
      - name: Restore prior ignored graph/cache
        if: steps.core-change.outputs.relevant == 'true' && steps.prior-run.outputs.result != ''
        uses: actions/download-artifact@v4
        with:
          name: core-product-graphify
          path: graphify-out
          run-id: ${{ steps.prior-run.outputs.result }}
          github-token: ${{ github.token }}
      - name: Regenerate exact-SHA graph incrementally
        if: steps.core-change.outputs.relevant == 'true'
        run: scripts/graphify-core-product.sh --incremental
      - name: Verify required operator artifact and receipt
        if: steps.core-change.outputs.relevant == 'true'
        run: |
          test -s graphify-out/graph.html
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          test -s graphify-out/manifest.json
          test -s graphify-out/core-product-receipt.json
      - name: Upload Graphify operator artifact
        if: steps.core-change.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-product-graphify
          path: graphify-out/
          retention-days: 30
