name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-hex repository commit to test
        required: true
        type: string
      test_selector:
        description: Xcode selector such as Target/TestClass/testMethod
        required: true
        type: string

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
  SNAPLIST_IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Validate reusable iOS test script and shard inventory
        run: zsh ios/Scripts/test-contract.test.sh

      - name: Validate deep-link configuration
        run: zsh ios/Scripts/deep-link-contract.test.sh

      - name: Validate app icon asset catalog
        run: zsh ios/Scripts/app-icon-contract.test.sh

      - name: Validate color token routing
        run: zsh ios/Scripts/token-routing-contract.test.sh

      - name: Validate light-only appearance lock
        run: zsh ios/Scripts/appearance-contract.test.sh

      - name: Validate Reduce Transparency material fallbacks
        run: zsh ios/Scripts/reduce-transparency-contract.test.sh

      - name: Validate Release archive configuration
        run: zsh ios/Scripts/release-config-contract.test.sh

      - name: Validate Clerk instance and API origin pairing
        run: zsh ios/Scripts/clerk-origin-pairing.test.sh

  shard:
    name: shard (${{ matrix.shard }})
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: macos-26
    # Not the budget. The budget is stated once, in
    # ios/Scripts/shard-wall-clock-budget-minutes, and ios/Scripts/test.sh
    # derives from it both the point where a shard annotates that it has
    # overrun (the budget itself, #936's acceptance criterion) and the point a
    # few minutes later where it stops the build and says so. This cap only has
    # to sit above that second point, so a hung shard reports a named timeout
    # instead of GitHub cancelling the job with nothing but "The operation was
    # canceled." test-contract.test.sh asserts that relationship rather than
    # comparing two copies of one number. See issue #936.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, ui-1, ui-2, ui-3, ui-4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Build app and run declared test shard
        env:
          SNAPLIST_IOS_SHARD: ${{ matrix.shard }}
        run: ios/Scripts/test.sh

  release:
    name: Release configuration
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Build verified Release configuration
        env:
          SNAPLIST_RELEASE_CLERK_PUBLISHABLE_KEY: pk_live_ci_release_validation
          SNAPLIST_RELEASE_CLERK_FRONTEND_DOMAIN: release-clerk.example.invalid
        run: ios/Scripts/build-release.sh

  test:
    needs: [validate, shard, release]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require validation and every shard
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [[ "$VALIDATE_RESULT" != "success" || "$SHARD_RESULT" != "success" || "$RELEASE_RESULT" != "success" ]]; then
            echo "iOS validation, Release build, or one or more declared test shards failed." >&2
            exit 1
          fi

  serial:
    if: github.event_name == 'push'
    runs-on: macos-26
    # The unsharded suite took 54m53s on 00da4f57a. Sixty left no room for
    # growth, and a timeout reports `cancelled`, which reads like nothing
    # failed even when the suite never finished. See issue #827.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Validate reusable iOS test script and shard inventory
        run: zsh ios/Scripts/test-contract.test.sh

      - name: Validate deep-link configuration
        run: zsh ios/Scripts/deep-link-contract.test.sh

      - name: Validate app icon asset catalog
        run: zsh ios/Scripts/app-icon-contract.test.sh

      - name: Validate color token routing
        run: zsh ios/Scripts/token-routing-contract.test.sh

      - name: Validate light-only appearance lock
        run: zsh ios/Scripts/appearance-contract.test.sh

      - name: Validate Reduce Transparency material fallbacks
        run: zsh ios/Scripts/reduce-transparency-contract.test.sh

      - name: Build app and run complete serial test suite
        run: ios/Scripts/test.sh

  release-main:
    name: Release configuration (main)
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Build verified Release configuration
        env:
          SNAPLIST_RELEASE_CLERK_PUBLISHABLE_KEY: pk_live_ci_release_validation
          SNAPLIST_RELEASE_CLERK_FRONTEND_DOMAIN: release-clerk.example.invalid
        run: ios/Scripts/build-release.sh

  focused:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Validate focused test inputs
        env:
          SNAPLIST_COMMIT_SHA: ${{ inputs.commit_sha }}
          SNAPLIST_IOS_ONLY_TESTING: ${{ inputs.test_selector }}
        run: |
          if [[ ! "$SNAPLIST_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be exactly 40 hexadecimal characters." >&2
            exit 64
          fi

          if [[ ! "$SNAPLIST_IOS_ONLY_TESTING" =~ ^[[:alnum:]_][[:alnum:]_.-]*(/[[:alnum:]_][[:alnum:]_.-]*){0,2}$ ]]; then
            echo "test_selector must be a non-empty Xcode test selector." >&2
            exit 64
          fi

      - name: Check out trusted workflow tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-tooling

      - name: Check out exact test target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          path: test-target

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Validate trusted reusable iOS test script
        run: zsh workflow-tooling/ios/Scripts/test-contract.test.sh

      - name: Validate exact-head deep-link configuration
        run: zsh test-target/ios/Scripts/deep-link-contract.test.sh

      - name: Validate exact-head app icon asset catalog
        run: zsh test-target/ios/Scripts/app-icon-contract.test.sh

      - name: Validate exact-head color token routing
        run: zsh test-target/ios/Scripts/token-routing-contract.test.sh

      - name: Validate exact-head light-only appearance lock
        run: zsh test-target/ios/Scripts/appearance-contract.test.sh

      - name: Validate exact-head Reduce Transparency material fallbacks
        run: zsh test-target/ios/Scripts/reduce-transparency-contract.test.sh

      - name: Build app and run one focused test
        env:
          SNAPLIST_IOS_ONLY_TESTING: ${{ inputs.test_selector }}
          SNAPLIST_IOS_REPOSITORY_ROOT: ${{ github.workspace }}/test-target
        run: workflow-tooling/ios/Scripts/test.sh
